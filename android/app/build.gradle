plugins { id 'com.android.application' }
android {
    namespace 'app.dshmobile.android'
    compileSdk 35
    defaultConfig { applicationId 'app.dshmobile.android'; minSdk 28; targetSdk 35; versionCode 15; versionName '0.6.3'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
